theme = "adwaita-dark"

[editor]
shell = ["nu", "-c"]
line-number = "relative"
popup-border = "all"
cursorline = true
end-of-line-diagnostics = "hint"

[editor.inline-diagnostics]
cursor-line = "error"

[editor.cursor-shape]
insert = "bar"

[editor.lsp]
display-inlay-hints = true

[keys.normal]
F12 = "@gd"
"C-A-up" = "@Xd<up>P"
"C-A-down" = "@Xdp"

[keys.select]
"C-A-up" = "@Xd<up>P"
"C-A-down" = "@Xdp"
